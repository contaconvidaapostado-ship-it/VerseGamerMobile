name: Build Android APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Removemos o 'cache: gradle' daqui para evitar o erro inicial

      - name: Unzip and Organize Project
        run: |
          # 1. Instala o unzip se não houver
          sudo apt-get install unzip -y
          
          # 2. Procura qualquer arquivo .zip e descompacta tudo na raiz
          find . -name "*.zip" -exec unzip -o {} -d ./temp_unzip/ \;
          
          # 3. Mover os arquivos da pasta interna para a raiz do GitHub
          # Isso resolve o problema se o ZIP criou uma pasta com o nome do projeto
          find ./temp_unzip -name "settings.gradle.kts" -o -name "settings.gradle" | xargs -I {} dirname {} > project_root.txt
          ROOT_DIR=$(cat project_root.txt)
          cp -rn $ROOT_DIR/* .
          
          # 4. Mostrar os arquivos para conferência no log
          echo "Estrutura de arquivos após organizar:"
          ls -R

      - name: Grant execute permission for gradlew
        run: |
          # Procura o arquivo gradlew e dá permissão de execução
          find . -name "gradlew" -exec chmod +x {} +

      - name: Build with Gradle
        run: |
          # Localiza o diretório que contém o gradlew e roda o build
          GRADLE_EXEC=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLE_EXEC" ]; then
            echo "ERRO: Arquivo gradlew não encontrado!"
            exit 1
          fi
          $GRADLE_EXEC assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VerseGamer-APK
          path: "**/build/outputs/apk/debug/*.apk"
