name: VerseGamer Final Fix - Ultra Stable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Java 17 Setup
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Limpeza Radical e Extração
        run: |
          mkdir -p raw_data
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "❌ ZIP não encontrado!"; exit 1; fi
          unzip -o "$ZIP_FILE" -d ./raw_data
          
          # Achar a raiz do projeto original e extrair o código fonte
          REAL_ROOT=$(find ./raw_data -name "build.gradle*" -printf '%h' -quit)
          
          # Apagar arquivos de configuração antigos para evitar conflitos
          rm -rf app/ gradle/ gradlew gradlew.bat build.gradle.kts settings.gradle.kts settings.gradle
          
          # Mover o código fonte (pastas src, etc) para a nova estrutura
          cp -rn $REAL_ROOT/* .
          
      - name: 4. Reconstrução Estável (Groovy Settings)
        run: |
          # Criar pasta app se não existir
          mkdir -p app
          
          # 1. Criar build.gradle.kts do APP (Kotlin DSL está OK aqui)
          cat <<EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.versegamer.mobile"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.versegamer.mobile"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.4" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.0")
              implementation("dev.rikka.shizuku:provider:13.1.0")
              implementation("androidx.compose.material3:material3:1.2.0")
              implementation("androidx.activity:activity-compose:1.8.2")
          }
          EOF

          # 2. Criar settings.gradle em GROOVY (Para evitar o erro de 'Unresolved reference')
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VerseGamerMobile"
          include ':app'
          EOF

      - name: 5. Forçar Gradle 8.2 e Wrapper
        run: |
          rm -rf gradle/ gradlew gradlew.bat
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: 6. Build Final Blindado
        run: |
          # -Dorg.gradle.native=false resolve o erro de biblioteca nativa no runner
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.native=false

      - name: 7. Download do APK
        uses: actions/upload-artifact@v4
        with:
          name: VerseGamer-Final-APK
          path: "app/build/outputs/apk/debug/*.apk"
