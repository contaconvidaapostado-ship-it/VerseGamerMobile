name: VerseGamer Ultimate Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Ambiente Java 17 (Estável)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Extração e Reorganização Inteligente
        run: |
          # Criar pasta temporária e extrair
          mkdir -p raw_data
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "❌ Erro: Nenhum arquivo ZIP encontrado no GitHub!"; exit 1; fi
          unzip -o "$ZIP_FILE" -d ./raw_data
          
          # Localizar a pasta real do projeto (onde está o settings.gradle.kts)
          REAL_ROOT=$(find ./raw_data -name "settings.gradle*" -printf '%h' -quit)
          if [ -z "$REAL_ROOT" ]; then echo "❌ Erro: ZIP não contém um projeto Android válido!"; exit 1; fi
          
          # Limpar raiz do GitHub e mover o projeto para lá
          echo "✅ Projeto localizado em $REAL_ROOT. Movendo para a raiz..."
          cp -rn $REAL_ROOT/* .
          
          # Listar arquivos para log de segurança
          ls -R

      - name: 4. Reparo de Compatibilidade (JVM & Kotlin)
        run: |
          # Forçar Java 17 em todos os arquivos build.gradle e build.gradle.kts
          find . -name "build.gradle*" -exec sed -i 's/sourceCompatibility = .*/sourceCompatibility = JavaVersion.VERSION_17/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/targetCompatibility = .*/targetCompatibility = JavaVersion.VERSION_17/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/jvmTarget = .*/jvmTarget = "17"/g' {} +
          
          # Garantir que o repositório MavenCentral e Google existam
          find . -name "settings.gradle*" -exec sed -i '/repositories {/a \        google()\n        mavenCentral()' {} +

      - name: 5. Fabricação do Motor Gradle 8.2 (Anti-Erro)
        run: |
          echo "🛠️ Gerando novo Gradlew 8.2..."
          rm -f gradlew
          rm -rf gradle/
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: 6. Build Final do APK (Modo Blindado)
        run: |
          # --no-daemon economiza memória
          # -Dorg.gradle.native=false evita erros de biblioteca nativa
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.native=false --stacktrace

      - name: 7. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: VerseGamer-Mobile-APK
          path: "app/build/outputs/apk/debug/*.apk"
