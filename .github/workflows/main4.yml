name: VerseGamer Nuke & Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Limpeza Radical e Extração
        run: |
          # Criar pasta temporária
          mkdir -p raw_data
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "❌ ZIP não encontrado!"; exit 1; fi
          unzip -o "$ZIP_FILE" -d ./raw_data
          
          # Achar a raiz do projeto (onde tem o settings ou build)
          REAL_ROOT=$(find ./raw_data -name "build.gradle*" -printf '%h' -quit)
          
          # APAGAR TUDO que possa causar conflito na raiz do GitHub
          rm -rf app/ gradle/ gradlew gradlew.bat build.gradle.kts settings.gradle.kts
          
          # Mover apenas o que interessa (o seu código) para a raiz
          cp -rn $REAL_ROOT/* .
          
      - name: 4. Reconstrução dos Arquivos de Configuração (Garantia de Sintaxe)
        run: |
          # Criar um build.gradle.kts zerado e perfeito para o APP
          mkdir -p app
          cat <<EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.versegamer.mobile"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.versegamer.mobile"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.4" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.0")
              implementation("dev.rikka.shizuku:provider:13.1.0")
              implementation("androidx.compose.material3:material3:1.2.0")
              implementation("androidx.activity:activity-compose:1.8.2")
          }
          EOF

          # Criar um settings.gradle.kts zerado e perfeito
          cat <<EOF > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VerseGamerMobile"
          include(":app")
          EOF

      - name: 5. Instalação Forçada do Gradle 8.2 (O Corretor de Erros)
        run: |
          # Remover qualquer resquício de wrapper antigo
          rm -rf gradle/ gradlew gradlew.bat
          
          # Baixar o binário do Gradle 8.2 diretamente
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          
          # Usar o binário baixado para gerar um NOVO wrapper compatível com Java 17
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: 6. Build Final (Modo Blindado)
        run: |
          # Agora usamos o gradlew que ACABAMOS de criar
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.native=false

      - name: 7. Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: VerseGamer-APK-Final
          path: "app/build/outputs/apk/debug/*.apk"
