name: Build Android APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o arquivo ZIP do seu repositório
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configura o Java (SEM CACHE para não dar erro)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Removi a linha de cache que estava causando o seu erro

      # 3. Descompacta e organiza os arquivos
      - name: Unzip Project
        run: |
          # Procura o arquivo .zip e descompacta em uma pasta temporária
          mkdir temp_project
          find . -name "*.zip" -exec unzip -o {} -d ./temp_project \;
          
          # Entra na pasta descompactada e move os arquivos para a raiz do GitHub
          # Isso corrige o problema de "pasta dentro de pasta"
          cd temp_project
          PROJECT_ROOT=$(find . -name "build.gradle*" -printf '%h' -quit)
          if [ -n "$PROJECT_ROOT" ]; then
            cp -rn $PROJECT_ROOT/* ..
          else
            echo "ERRO: Não encontrei os arquivos do Android dentro do ZIP!"
            exit 1
          fi
          cd ..
          
          # Garante que o Gradle tenha permissão para rodar
          # Se não houver gradlew no ZIP, nós criamos um
          if [ ! -f "gradlew" ]; then
            sudo apt-get install gradle -y
            gradle wrapper
          fi
          chmod +x gradlew

      # 4. Executa a construção do APK
      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.native=false

      # 5. Disponibiliza o APK para download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VerseGamer-Final-APK
          path: app/build/outputs/apk/debug/*.apk
