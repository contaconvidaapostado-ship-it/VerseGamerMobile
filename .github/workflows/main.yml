name: Build Android APK (Fix Java Version)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip and Fix Gradle Version
        run: |
          # 1. Descompactar o ZIP
          find . -name "*.zip" -exec unzip -o {} -d ./temp_folder \;
          
          # 2. Mover arquivos para a raiz do repositório
          PROJECT_ROOT=$(find ./temp_folder -name "build.gradle*" -printf '%h' -quit)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERRO: Arquivos do Android não encontrados no ZIP!"
            exit 1
          fi
          cp -rn $PROJECT_ROOT/* .
          
          # 3. FORÇAR GRADLE 8.2 (Compatível com Java 17)
          # Isso apaga o gradlew antigo e cria um novo e moderno
          echo "🛠️ Atualizando Gradle para versão 8.2..."
          rm -f gradlew
          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build with Gradle
        run: |
          # Executa o build com a versão correta
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.native=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VerseGamer-Final-APK
          path: "app/build/outputs/apk/debug/*.apk"
