name: Build Android APK (Fix JVM Target)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip and Fix Project
        run: |
          # 1. Descompactar o ZIP
          find . -name "*.zip" -exec unzip -o {} -d ./temp_folder \;
          
          # 2. Mover arquivos para a raiz
          PROJECT_ROOT=$(find ./temp_folder -name "build.gradle*" -printf '%h' -quit)
          cp -rn $PROJECT_ROOT/* .
          
          # 3. CORREÇÃO DE COMPATIBILIDADE (Java + Kotlin -> 17)
          # Este comando procura as configurações de compilação no build.gradle.kts 
          # e garante que o Java e o Kotlin usem a versão 17.
          sed -i 's/sourceCompatibility = .*/sourceCompatibility = JavaVersion.VERSION_17/g' app/build.gradle.kts || true
          sed -i 's/targetCompatibility = .*/targetCompatibility = JavaVersion.VERSION_17/g' app/build.gradle.kts || true
          sed -i 's/jvmTarget = .*/jvmTarget = "17"/g' app/build.gradle.kts || true

          # 4. Atualizar o Gradle Wrapper para a versão 8.2
          rm -f gradlew
          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build with Gradle
        run: |
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.native=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VerseGamer-Final-APK
          path: "app/build/outputs/apk/debug/*.apk"
